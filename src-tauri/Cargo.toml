[package]
name = "patchfleet-desktop"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Patchfleet local Rust desktop host"

[lib]
name = "patchfleet_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
patchfleet-core = { path = "../crates/patchfleet-core" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
