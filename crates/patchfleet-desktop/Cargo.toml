[package]
name = "patchfleet-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Patchfleet native Rust agent command center"

[dependencies]
patchfleet-core = { path = "../patchfleet-core" }
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
ui-smoke = ["eframe/__screenshot"]
