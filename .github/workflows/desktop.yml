name: Native Rust desktop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            formats: app,dmg
            executable: patchfleet-desktop
            archive_paths: Patchfleet.app *.dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            formats: app,dmg
            executable: patchfleet-desktop
            archive_paths: Patchfleet.app *.dmg
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            formats: nsis,wix
            executable: patchfleet-desktop.exe
            archive_paths: '*-setup.exe *.msi'
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
            executable: patchfleet-desktop
            archive_paths: '*.deb *.AppImage'
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            formats: deb,appimage
            executable: patchfleet-desktop
            archive_paths: '*.deb *.AppImage'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CI: 'true'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Linux native window and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev file patchelf squashfs-tools xdg-utils
      - name: Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
      - run: cargo fmt --all -- --check
      - name: Native behavior tests
        run: cargo test --locked --workspace --target ${{ matrix.target }}
      - name: Native lint checks
        run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Build standalone Rust desktop
        run: cargo build --locked --release -p patchfleet-desktop --target ${{ matrix.target }}
      - name: Reject browser-engine runtime dependencies
        run: |
          cargo tree --locked -p patchfleet-desktop --target ${{ matrix.target }} --prefix none | while read -r dependency remainder; do
            case "$dependency" in
              tauri*|wry|webkit2gtk*|webview2*|javascriptcore*)
                echo "Unexpected browser-engine dependency: $dependency"
                exit 1
                ;;
            esac
          done
      - name: Install pinned packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Stage only the native executable
        run: |
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/${{ matrix.executable }} target/release/${{ matrix.executable }}
      - name: Build development installers
        run: cargo packager --config Packager.toml --target ${{ matrix.target }} --out-dir dist/${{ matrix.target }} --formats ${{ matrix.formats }}
      - name: Verify package outputs
        run: |
          output="dist/${{ matrix.target }}"
          case "$RUNNER_OS" in
            macOS)
              test -x "$output/Patchfleet.app/Contents/MacOS/patchfleet-desktop"
              test -f "$output"/*.dmg
              test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$output/Patchfleet.app/Contents/Info.plist")" = com.patchfleet.desktop
              test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$output/Patchfleet.app/Contents/Info.plist")" = 0.5.1
              /usr/libexec/PlistBuddy -c 'Print NSDocumentsFolderUsageDescription' "$output/Patchfleet.app/Contents/Info.plist"
              codesign --verify --deep --strict "$output/Patchfleet.app"
              ;;
            Windows)
              test -f "$output"/*-setup.exe
              test -f "$output"/*.msi
              ;;
            Linux)
              test -f "$output"/*.deb
              test -x "$output"/*.AppImage
              dpkg-deb --info "$output"/*.deb
              ;;
          esac
      - name: Archive installers with executable permissions preserved
        run: |
          cd dist/${{ matrix.target }}
          tar -czf ../../patchfleet-${{ matrix.target }}.tar.gz ${{ matrix.archive_paths }}
      - name: Preserve development artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patchfleet-native-${{ matrix.target }}
          path: patchfleet-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14
