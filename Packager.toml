# cargo-packager 0.11.8; build the Rust executable before running the packager.
name = "patchfleet-desktop"
product-name = "Moxcrew"
version = "0.12.0"
identifier = "com.patchfleet.desktop"
publisher = "Moxcrew"
authors = ["Moxcrew contributors"]
description = "Your local AI crew: projects, tasks and shared decisions"
homepage = "https://github.com/BaydoganMirac/patchfleet"
license-file = "LICENSE"
resources = [
  { src = "LICENSE", target = "LICENSE.txt" },
  { src = "crates/patchfleet-desktop/assets/fonts/OFL.txt", target = "FONT-LICENSE.txt" },
  { src = "crates/patchfleet-desktop/assets/windows/LICENSE-cargo-packager-MIT", target = "LICENSE-CARGO-PACKAGER-MIT.txt" },
]
category = "DeveloperTool"
out-dir = "dist/native"
binaries-dir = "target/release"
icons = [
  "crates/patchfleet-desktop/assets/icons/32x32.png",
  "crates/patchfleet-desktop/assets/icons/128x128.png",
  "crates/patchfleet-desktop/assets/icons/128x128@2x.png",
  "crates/patchfleet-desktop/assets/icons/icon.icns",
  "crates/patchfleet-desktop/assets/icons/icon.ico",
]

[[binaries]]
path = "patchfleet-desktop"
main = true

[macos]
minimum-system-version = "11.0"
# Development artifacts use an ad-hoc signature; public signing is a separate release action.
signing-identity = "-"
info-plist-path = "crates/patchfleet-desktop/assets/macos-permissions.plist"

[nsis]
template = "crates/patchfleet-desktop/assets/windows/installer.nsi"
installMode = "currentUser"
installer-icon = "crates/patchfleet-desktop/assets/icons/icon.ico"
# No appdata-paths: uninstallers must preserve the existing local canonical data.

[wix]
template = "crates/patchfleet-desktop/assets/windows/main.wxs"

[deb]
package-name = "patchfleet-desktop"
section = "devel"
depends = [
  "libc6", "libgcc-s1", "libstdc++6",
  "libx11-6", "libxcursor1", "libxi6", "libxrandr2",
  "libxcb1", "libxcb-render0", "libxcb-shape0", "libxcb-xfixes0",
  "libxkbcommon0", "libxkbcommon-x11-0",
  "libegl1", "libgl1",
  "libwayland-client0", "libwayland-cursor0", "libwayland-egl1",
  "libdbus-1-3", "xdg-desktop-portal", "zenity",
]
