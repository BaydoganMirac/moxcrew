[workspace]
members = ["crates/patchfleet-core", "crates/patchfleet-desktop"]
default-members = ["crates/patchfleet-core"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
fs2 = "0.4"
regex = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
